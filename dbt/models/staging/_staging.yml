version: 2

# 13 enforced contracts (SPEC 7.2). Contract types render through dt_type() so the same YAML works on
# DuckDB (local stand-in) and BigQuery. Model meta drives probe planning (SPEC 10, 11):
#   grain: key columns; foreign_keys: column -> parent model column; interval: half-open history;
#   timezone: instant and zone columns; classification: pii | identifier | compensation | internal | public.

models:
  - name: stg_departments
    config:
      contract: {enforced: true}
      meta:
        grain: [department_id]
    columns:
      - name: department_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: department_name
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: public}}
      - name: cost_center
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: internal}}

  - name: stg_locations
    config:
      contract: {enforced: true}
      meta:
        grain: [location_id]
    columns:
      - name: location_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: location_name
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: public}}
      - name: country_code
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: public}}
      - name: location_tz
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: public}}
      - name: currency
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: public}}

  - name: stg_employees
    config:
      contract: {enforced: true}
      meta:
        grain: [employee_id]
    columns:
      - name: employee_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: emp}}
        data_tests:
          - unique:
              name: dq_u01_unique_stg_employees_employee_id
      - name: first_name
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: pii}}
      - name: last_name
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: pii}}
      - name: work_email
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: pii}}
      - name: birth_date
        data_type: "date"
        config: {meta: {classification: pii}}
      - name: hire_date
        data_type: "date"
        config: {meta: {classification: internal}}
      - name: termination_date
        data_type: "date"
        config: {meta: {classification: internal}}

  - name: stg_job_assignments
    config:
      contract: {enforced: true}
      meta:
        grain: [assignment_id]
        foreign_keys:
          - {column: employee_id, parent: stg_employees, parent_column: employee_id}
          - {column: department_id, parent: stg_departments, parent_column: department_id}
          - {column: location_id, parent: stg_locations, parent_column: location_id}
        interval: {key: [employee_id], from: valid_from, to: valid_to}
    data_tests:
      - expression_is_true:
          name: dq_h03_assignment_valid_to_after_valid_from
          arguments: {expression: "valid_to is null or valid_to > valid_from"}
    columns:
      - name: assignment_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: employee_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: emp}}
        data_tests:
          - relationships:
              name: dq_r01_job_assignments_employee_exists
              arguments: {to: ref('stg_employees'), field: employee_id}
      - name: department_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
        data_tests:
          - relationships:
              name: dq_r02_job_assignments_department_exists
              arguments: {to: ref('stg_departments'), field: department_id}
      - name: location_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: job_title
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: internal}}
      - name: job_level
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: valid_from
        data_type: "date"
        config: {meta: {classification: internal}}
      - name: valid_to
        data_type: "date"
        config: {meta: {classification: internal}}
      - name: is_current
        data_type: "{{ 'bool' if target.type == 'bigquery' else 'boolean' }}"
        config: {meta: {classification: internal}}

  - name: stg_requisitions
    config:
      contract: {enforced: true}
      meta:
        grain: [requisition_id]
        foreign_keys:
          - {column: department_id, parent: stg_departments, parent_column: department_id}
          - {column: location_id, parent: stg_locations, parent_column: location_id}
    columns:
      - name: requisition_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: department_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: location_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: job_title
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: internal}}
      - name: openings
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: opened_at
        data_type: "{{ 'timestamp' if target.type == 'bigquery' else 'timestamptz' }}"
        config: {meta: {classification: internal}}

  - name: stg_candidates
    config:
      contract: {enforced: true}
      meta:
        grain: [candidate_id]
    columns:
      - name: candidate_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: cand}}
      - name: first_name
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: pii}}
      - name: last_name
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: pii}}
      - name: email
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: pii}}
      - name: phone
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: pii}}
      - name: created_at
        data_type: "{{ 'timestamp' if target.type == 'bigquery' else 'timestamptz' }}"
        config: {meta: {classification: internal}}

  - name: stg_applications
    config:
      contract: {enforced: true}
      meta:
        grain: [application_id]
        foreign_keys:
          - {column: candidate_id, parent: stg_candidates, parent_column: candidate_id}
          - {column: requisition_id, parent: stg_requisitions, parent_column: requisition_id}
    columns:
      - name: application_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: app}}
        data_tests:
          - unique:
              name: dq_u03_unique_stg_applications_application_id
      - name: candidate_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: cand}}
        data_tests:
          - relationships:
              name: dq_r03_applications_candidate_exists
              arguments: {to: ref('stg_candidates'), field: candidate_id}
      - name: requisition_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
        data_tests:
          - relationships:
              name: dq_r04_applications_requisition_exists
              arguments: {to: ref('stg_requisitions'), field: requisition_id}
      - name: source_channel
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: internal}}
      - name: applied_at
        data_type: "{{ 'timestamp' if target.type == 'bigquery' else 'timestamptz' }}"
        config: {meta: {classification: internal}}

  - name: stg_stage_events
    config:
      contract: {enforced: true}
      meta:
        grain: [event_id]
        foreign_keys:
          - {column: application_id, parent: stg_applications, parent_column: application_id}
        timezone: {ts: entered_at, tz: location_tz, filter_column: source_system, filter_value: recruiter_tool}
        transitions: {key: application_id, stage: stage, order: stage_order, ts: entered_at}
        # Probe expressions use the probe dialect functions tz_local_date(ts, tz) and int_div(a, b).
        recompute: [{column: event_local_date, expr: "tz_local_date(entered_at, location_tz)", compare: exact}]
    columns:
      - name: event_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: application_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: app}}
      - name: stage_label
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: internal}}
      - name: stage
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: internal}}
        data_tests:
          - accepted_values:
              name: dq_s01_stage_accepted_values
              arguments:
                values: [applied, screen, onsite, offer, hired, rejected, withdrawn, declined]
      - name: stage_order
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: entered_at
        data_type: "{{ 'timestamp' if target.type == 'bigquery' else 'timestamptz' }}"
        config: {meta: {classification: internal}}
      - name: source_system
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: internal}}
      - name: location_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: location_tz
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: public}}
      - name: event_local_date
        data_type: "date"
        config: {meta: {classification: internal}}
      - name: event_local_hour
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}

  - name: stg_offers
    config:
      contract: {enforced: true}
      meta:
        grain: [offer_id]
        foreign_keys:
          - {column: application_id, parent: stg_applications, parent_column: application_id}
    columns:
      - name: offer_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: application_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: app}}
        data_tests:
          - relationships:
              name: dq_r06_offers_application_exists
              arguments: {to: ref('stg_applications'), field: application_id}
      - name: offer_status
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: internal}}
      - name: offered_at
        data_type: "{{ 'timestamp' if target.type == 'bigquery' else 'timestamptz' }}"
        config: {meta: {classification: internal}}
      - name: responded_at
        data_type: "{{ 'timestamp' if target.type == 'bigquery' else 'timestamptz' }}"
        config: {meta: {classification: internal}}

  - name: stg_hires
    config:
      contract: {enforced: true}
      meta:
        grain: [hire_id]
        unique_keys: [[application_id], [employee_id]]
        foreign_keys:
          - {column: application_id, parent: stg_applications, parent_column: application_id}
          - {column: employee_id, parent: stg_employees, parent_column: employee_id}
    columns:
      - name: hire_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: hire}}
        data_tests:
          - unique:
              name: dq_u04_unique_stg_hires_hire_id
      - name: application_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: app}}
      - name: employee_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: emp}}
        data_tests:
          - relationships:
              name: dq_r05_hires_employee_exists
              arguments: {to: ref('stg_employees'), field: employee_id}
      - name: hire_date
        data_type: "date"
        config: {meta: {classification: internal}}

  - name: stg_compensation
    config:
      contract: {enforced: true}
      meta:
        grain: [compensation_id]
        foreign_keys:
          - {column: employee_id, parent: stg_employees, parent_column: employee_id}
        interval: {key: [employee_id], from: valid_from, to: valid_to}
        casts: [{column: base_salary_local_minor, type: int}]
    columns:
      - name: compensation_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: employee_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: emp}}
      - name: currency
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: internal}}
      - name: base_salary_local_minor
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: compensation}}
      - name: base_salary_local
        data_type: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(38,9)' }}"
        config: {meta: {classification: compensation}}
      - name: valid_from
        data_type: "date"
        config: {meta: {classification: internal}}
      - name: valid_to
        data_type: "date"
        config: {meta: {classification: internal}}

  - name: stg_fx_rates
    config:
      contract: {enforced: true}
      meta:
        grain: [currency, rate_date]
        fx: {currency: currency, date: rate_date, rate: rate_to_usd}
    data_tests:
      - unique_combination:
          name: dq_u07_unique_stg_fx_rates_currency_rate_date
          arguments: {combination_of_columns: [currency, rate_date]}
    columns:
      - name: currency
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: public}}
      - name: rate_date
        data_type: "date"
        config: {meta: {classification: public}}
      - name: rate_to_usd
        data_type: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(38,9)' }}"
        config: {meta: {classification: public}}

  - name: stg_payroll_lines
    config:
      contract: {enforced: true}
      meta:
        grain: [payroll_line_id]
        unique_keys: [[employee_id, pay_month]]
        foreign_keys:
          - {column: employee_id, parent: stg_employees, parent_column: employee_id}
        casts: [{column: gross_pay_local_minor, type: int}]
    columns:
      - name: payroll_line_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: internal}}
      - name: employee_id
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: identifier, entity: emp}}
        data_tests:
          - relationships:
              name: dq_r07_payroll_lines_employee_exists
              arguments: {to: ref('stg_employees'), field: employee_id}
      - name: pay_month
        data_type: "date"
        config: {meta: {classification: internal}}
      - name: currency
        data_type: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        config: {meta: {classification: internal}}
      - name: gross_pay_local_minor
        data_type: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        config: {meta: {classification: compensation}}
      - name: gross_pay_local
        data_type: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(38,9)' }}"
        config: {meta: {classification: compensation}}
      - name: paid_at
        data_type: "{{ 'timestamp' if target.type == 'bigquery' else 'timestamptz' }}"
        config: {meta: {classification: internal}}
