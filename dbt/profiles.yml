# Every env_var has a default, so `dbt parse` works with no credentials and no .prod/ files.
datatrust:
  target: "{{ env_var('DATATRUST_DBT_TARGET', 'duckdb') }}"
  outputs:
    duckdb:
      # Local and CI warehouse: DuckDB is the stand-in for BigQuery (SPEC section 4).
      type: duckdb
      path: "{{ env_var('DATATRUST_DUCKDB_PATH', '.data/warehouse.duckdb') }}"
      threads: 4
      settings:
        # ADR-0006: without this the session inherits the machine zone and local dates differ by OS.
        TimeZone: UTC
    bigquery:
      # Production warehouse. OAuth via `gcloud auth application-default login` (SPEC 7.4, 21.2). With
      # DATATRUST_BUILDER_SA set (setup:prod writes it to .env.prod), dbt impersonates datatrust-builder, which
      # owns the four datatrust_* datasets and reads nothing else in the shared project; empty means your own
      # credentials (dbt-bigquery 1.12.1 impersonates only when the value is non-empty).
      type: bigquery
      method: oauth
      impersonate_service_account: "{{ env_var('DATATRUST_BUILDER_SA', '') }}"
      project: "{{ env_var('DATATRUST_GCP_PROJECT', 'datatrust-ci-placeholder') }}"
      dataset: datatrust_staging
      location: "{{ env_var('DATATRUST_BQ_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      maximum_bytes_billed: 1000000000
    bigquery_sa:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('DATATRUST_BQ_KEYFILE', '/nonexistent/keyfile.json') }}"
      project: "{{ env_var('DATATRUST_GCP_PROJECT', 'datatrust-ci-placeholder') }}"
      dataset: datatrust_staging
      location: "{{ env_var('DATATRUST_BQ_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      maximum_bytes_billed: 1000000000
