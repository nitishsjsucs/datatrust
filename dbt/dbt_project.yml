name: datatrust
version: "1.0.0"
config-version: 2
profile: datatrust

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: target
clean-targets: ["target", "logs"]

# Shared Google Cloud project (SPEC 28.5.10): every dbt job on BigQuery carries the label app=datatrust
# (dbt-bigquery turns the JSON query comment into job labels) and every table the label app=datatrust.
# profiles.yml caps each query at 1 GB with maximum_bytes_billed.
query-comment:
  comment: '{"app": "datatrust"}'
  job-label: true

flags:
  send_anonymous_usage_stats: false
  partial_parse: false
  require_generic_test_arguments_property: true

vars:
  # Calendar covered by payroll, FX and metrics (SPEC 6.2).
  calendar_start: "2025-01-01"
  calendar_end: "2025-12-31"
  # Absolute directory of per-run Parquet snapshots of marts (DuckDB time-travel stand-in, SPEC 7.3).
  snapshot_dir: "{{ env_var('DATATRUST_SNAPSHOT_DIR', '/tmp/datatrust-snapshots') }}"
  # BigQuery policy tag resource names. setup:prod writes the real ones to .prod/dbt_vars.yml;
  # `datatrust prod validate` refuses to build while any placeholder is in effect (SPEC 7.4).
  pt_pii_string: "projects/placeholder/locations/us/taxonomies/0/policyTags/0"
  pt_pii_date: "projects/placeholder/locations/us/taxonomies/0/policyTags/1"
  pt_compensation: "projects/placeholder/locations/us/taxonomies/0/policyTags/2"

models:
  datatrust:
    +labels:
      app: datatrust
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
    metrics:
      +schema: marts
      +materialized: table
    restricted:
      +schema: restricted
      +materialized: view
