[project]
name = "datatrust"
version = "0.1.0"
description = "Lineage-aware data quality and root-cause analysis for workforce data: runner, dbt project, benchmark"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "dbt-bigquery==1.12.1",
    "openlineage-dbt==1.53.0",
    "openlineage-python==1.53.0",
    "duckdb==1.5.6",
    "pyarrow==26.0.0",
    "pyiceberg[sql-sqlite,pyarrow]==0.12.0",
    "google-cloud-bigquery==3.46.1",
    "google-cloud-datacatalog==3.32.0",
    "google-cloud-bigquery-datapolicies==0.10.1",
    "sqlglot==30.22.0",
    "requests==2.34.2",
    "tzdata==2026.5",
]

[project.scripts]
datatrust = "datatrust.cli:main"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines/datatrust"]

[tool.pytest.ini_options]
testpaths = ["pipelines/tests"]
addopts = "-ra -m 'not bench and not e2e'"
markers = [
    "bench: runs benchmark trials; run with `uv run pytest -m bench` (CI bench-offline job)",
    "e2e: needs the local Worker on DATATRUST_API_URL; run with `npm run bench:e2e` or `uv run pytest -m e2e`",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["pipelines"]
extend-exclude = ["dbt", "node_modules", ".data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Markdown table rows and user-facing fix instructions are long strings.
"pipelines/datatrust/bench/report.py" = ["E501"]
"pipelines/datatrust/doctor.py" = ["E501"]
"pipelines/datatrust/bench/summaries.py" = ["E501"]
"pipelines/datatrust/bench/pii.py" = ["E501"]
"pipelines/datatrust/prod/free_budget.py" = ["E501"]
