name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  DBT_PROFILES_DIR: dbt

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: generated Worker types are current
        run: npx wrangler types --strict-vars=false --check
        working-directory: apps/worker
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:rca
      - run: npm run test:worker
      - name: Workers Free plan CPU budget (cold main-thread CPU per path, gate 8 ms of the 10 ms limit)
        run: npm run budget:cpu -- --gate 8
      - name: Worker bundles (local config)
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: apps/worker
      - name: Worker bundles (production template rendered with placeholder ids)
        run: |
          node scripts/render-prod-config.mjs --placeholders
          cd apps/worker && npx wrangler deploy --dry-run --outdir dist-prod -c wrangler.prod.jsonc

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the Python runner calls the bundled TypeScript RCA CLI (ADR-0002)
      - run: npm run build -w @datatrust/rca
      # setup-uv publishes no floating major tag (none since v8), so pin the release
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest
        env:
          TZ: UTC
      - name: clean baseline under a non-UTC machine zone (ADR-0006)
        run: uv run pytest pipelines/tests/test_clean_baseline.py
        env:
          TZ: America/Los_Angeles

  bench-offline:
    # Seed 101 only: 20 injected trials + 1 clean trial on DuckDB (local stand-in for BigQuery).
    # Gates: no clean false positives; detection and top-3 within 0.05 of results/baseline-seed101.json.
    needs: [node, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @datatrust/rca
      # setup-uv publishes no floating major tag (none since v8), so pin the release
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          uv run datatrust bench --mode offline --seeds 101 --workers 2 --out bench-out
          --gate results/baseline-seed101.json
      - name: no PII in any seed-101 prompt (SPEC 13.8)
        run: uv run pytest -m bench
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-offline-seed101
          path: bench-out/

  e2e:
    # Every trial through wrangler dev --local (Miniflare): Queues, both Workflows, the runner and the template
    # summarizer; S01, T14 and S04 on seed 101, plus the parity test against the offline mode.
    needs: [node, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # setup-uv publishes no floating major tag (none since v8), so pin the release
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked
      - run: bash scripts/bench-e2e.sh --pytest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-logs
          path: .dev/logs/
