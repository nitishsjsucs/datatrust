name: nightly-benchmark

# Full five-seed offline benchmark (SPEC 12.2): 100 injected trials and 5 clean trials on DuckDB, the local
# stand-in for BigQuery, with the leave-one-scenario-out figure. Gates against the committed five-seed
# results/baseline.json: no clean false positives, detection and top-3 within 0.05.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-benchmark
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  DBT_PROFILES_DIR: dbt

jobs:
  bench-five-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @datatrust/rca
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: five-seed benchmark with the frozen weights
        run: >-
          uv run datatrust bench --mode offline --seeds 101-105 --workers 4 --out bench-out
          --dev-results results/bench-2026-10-10-offline-dev.json --gate results/baseline.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-bench-five-seeds
          path: bench-out/
